<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Tự báo cáo HVA–NQ52</title></head><body><template id="monthly-report-template"><style>:host{display:block;font:15px/1.55 Inter,"Segoe UI",Arial,sans-serif;color:#20364a}*{box-sizing:border-box}[hidden]{display:none!important}h2,h3{font-size:19px;color:#173c60;margin:0 0 8px}h3{font-size:17px}p{margin:6px 0}button,input,textarea,select{font:inherit}button{border:1px solid #cbd9e5;background:#fff;color:#185d93;border-radius:7px;padding:9px 12px;min-height:40px;cursor:pointer;font-weight:600}button:disabled{opacity:.55;cursor:not-allowed}.primary,#addTaskBtn{background:#185d93;color:white;border-color:#185d93}.field{width:100%;border:1px solid #cbd5e1;border-radius:7px;padding:9px 10px;background:white;color:#20364a;min-width:0}.field:disabled{background:#f4f6f9}textarea{min-height:72px;resize:vertical}label{font-weight:600}button:focus-visible,.field:focus-visible{outline:2px solid #185d93;outline-offset:2px}#steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.step{text-align:left}.step.active{background:#e8f1fa;border-color:#9bbde0}main>section:nth-of-type(2),.panel>div.bg-white,.panel .bg-white.border{border:1px solid #dce4ed;border-radius:9px;padding:16px;background:white;margin:12px 0}.panel:not(.active){display:none}.flex{display:flex}.flex-1{flex:1}.flex-wrap{flex-wrap:wrap}.items-end{align-items:end}.items-start{align-items:start}.justify-between{justify-content:space-between}.gap-2{gap:8px}.gap-3{gap:12px}.grid{display:grid;gap:10px}.grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.rounded-xl,.rounded-lg{border-radius:8px}.p-3{padding:12px}.mt-3,.mt-4{margin-top:12px}.space-y-2>*+*,.space-y-3>*+*,.space-y-4>*+*{margin-top:10px}.bg-slate-50{background:#f4f6f9}.bg-blue-50{background:#eaf2fa}.bg-amber-50{background:#fff7ed}.font-extrabold,.font-bold{font-weight:700}.text-xl{font-size:24px;font-weight:700}.text-slate-500,.text-slate-400,.text-slate-600,.text-amber-800{font-size:13px;color:#617387}.text-brand-700{color:#173c60}.block{display:block}.shrink-0{flex:none}#personName{font-size:19px}#reportMonth{max-width:190px}.report-task{border:1px solid #dce4ed;border-radius:9px;padding:15px;margin:10px 0}.report-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.report-grid label{display:grid;gap:5px;min-width:0;font-size:14px}.wide{grid-column:1/-1}.half{grid-column:span 2}.muted{font-size:13px;color:#617387}.readonly-box{background:#f4f6f9;border:1px dashed #cbd5e1;padding:9px;border-radius:7px;color:#52677c}.report-line{padding:10px;border-bottom:1px solid #dce4ed;overflow-wrap:anywhere}.report-check{padding:9px;border-bottom:1px solid #dce4ed}.report-check.ok{color:#256345}.report-check.todo{color:#9a3412}.report-actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}#reportMessage{color:#52677c;font-size:14px}dialog{width:min(950px,92vw);max-height:88vh;overflow:auto;border:1px solid #cbd5e1;border-radius:10px;padding:18px}dialog::backdrop{background:#142e4980}.preview-sheet{font:15px/1.5 "Times New Roman",serif}.preview-sheet h2{text-align:center}.preview-sheet table{border-collapse:collapse;width:100%;font-size:13px}.preview-sheet td,.preview-sheet th{border:1px solid #aab5c0;padding:7px;vertical-align:top;overflow-wrap:anywhere}.preview-sheet p{white-space:pre-wrap}#reportAttachment{display:none}#submitBtn{width:100%}.panel[data-panel="3"]>div,.panel[data-panel="4"]>div{grid-template-columns:minmax(0,2fr) minmax(230px,1fr)}@media(max-width:1150px){.report-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel[data-panel="3"]>div,.panel[data-panel="4"]>div{grid-template-columns:1fr}}@media(max-width:650px){#steps{grid-template-columns:1fr 1fr}.report-grid,.grid-cols-3{grid-template-columns:1fr}.half{grid-column:1/-1}}</style><main class="page-pad max-w-6xl mx-auto px-5 py-4">
    <section class="grid grid-cols-2 md:grid-cols-4 gap-2 no-print" id="steps">
      <button class="step active border rounded-xl px-3 py-2.5 text-left text-[11px] font-bold" data-step="1">1. Dữ liệu nguồn</button>
      <button class="step border rounded-xl px-3 py-2.5 text-left text-[11px] font-bold bg-white" data-step="2">2. Báo cáo kết quả</button>
      <button class="step border rounded-xl px-3 py-2.5 text-left text-[11px] font-bold bg-white" data-step="3">3. Tổng hợp tháng</button>
      <button class="step border rounded-xl px-3 py-2.5 text-left text-[11px] font-bold bg-white" data-step="4">4. Kiểm tra & gửi</button>
    </section>

    <section class="mt-3 bg-white border border-slate-200 rounded-2xl shadow-sm p-4">
      <div class="flex flex-wrap items-end gap-3">
        <div class="flex-1 min-w-[190px]"><label class="block text-[9px] font-extrabold text-slate-500 uppercase mb-1">Người báo cáo</label><div id="personName" class="text-[13px] font-extrabold text-brand-700">Đang xác định...</div><div id="personMeta" class="text-[10px] text-slate-500 mt-0.5"></div><div id="personGroup" class="inline-flex mt-1 px-2 py-1 rounded-lg bg-blue-50 text-blue-700 text-[9px] font-extrabold">Đang tự xác định nhóm...</div></div>
        <div class="w-full sm:w-44"><label for="reportMonth" class="block text-[9px] font-extrabold text-slate-500 uppercase mb-1">Tháng báo cáo</label><input id="reportMonth" disabled type="month" class="field"></div>
        <span id="statusBadge" class="px-3 py-2 rounded-xl text-[10px] font-extrabold bg-slate-100 text-slate-600">ĐANG TẢI</span>
      </div>
    </section>

    <div id="loading" hidden class="mt-3 bg-white border rounded-2xl p-12 text-center"><div class="w-9 h-9 border-4 border-blue-100 border-t-blue-600 rounded-full animate-spin mx-auto"></div><p class="text-xs text-slate-500 mt-3">Đang tải báo cáo tháng...</p></div>

    <div id="workspace">
      <section class="panel active mt-3" data-panel="1">
        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-4">
          <div class="flex items-start justify-between gap-3"><div><h2 class="text-sm font-extrabold text-brand-700">Dữ liệu nhiệm vụ trong tháng</h2><p class="text-[10px] text-slate-500 mt-1">Nhiệm vụ hệ thống được giữ nguyên nội dung; có thể bổ sung nhiệm vụ phát sinh thực tế.</p></div><button id="addTaskBtn" class="shrink-0 px-3 py-2 rounded-xl bg-blue-600 text-white text-[10px] font-bold"><i class="bi bi-plus-lg mr-1"></i>Thêm nhiệm vụ</button></div>
          <div class="grid grid-cols-3 gap-2 mt-4"><div class="rounded-xl bg-slate-50 p-3"><div class="text-[9px] text-slate-500">TỔNG NHIỆM VỤ</div><div id="countAll" class="text-xl font-extrabold text-brand-700 mt-1">0</div></div><div class="rounded-xl bg-blue-50 p-3"><div class="text-[9px] text-blue-600">TỪ HỆ THỐNG</div><div id="countSource" class="text-xl font-extrabold text-blue-700 mt-1">0</div></div><div class="rounded-xl bg-amber-50 p-3"><div class="text-[9px] text-amber-700">PHÁT SINH</div><div id="countManual" class="text-xl font-extrabold text-amber-700 mt-1">0</div></div></div>
          <div id="sourceList" class="mt-4 space-y-2"></div>
        </div>
      </section>

      <section class="panel mt-3" data-panel="2">
        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-4">
          <h2 class="text-sm font-extrabold text-brand-700">Kết quả thực hiện từng nhiệm vụ</h2><p class="text-[10px] text-slate-500 mt-1">Khai đầy đủ kết quả và minh chứng của từng nhiệm vụ trước khi gửi.</p>
          <div id="taskEditor" class="mt-4 space-y-3"></div>
        </div>
      </section>

      <section class="panel mt-3" data-panel="3">
        <div class="grid lg:grid-cols-3 gap-3">
          <div class="lg:col-span-2 bg-white border rounded-2xl shadow-sm p-4 space-y-4">
            <div><label class="text-[10px] font-extrabold text-slate-700">Ưu điểm <span class="text-red-500">*</span></label><textarea id="highlight" rows="4" class="field mt-1" placeholder="Tự nhận xét ngắn gọn về ưu điểm, kết quả và đóng góp nổi bật trong tháng..."></textarea><p class="text-[9px] text-slate-400 mt-1">Có thể lưu nháp khi chưa nhập; bắt buộc trước khi gửi chính thức.</p></div>
            <div><label class="text-[10px] font-extrabold text-slate-700">Hạn chế, khuyết điểm <span class="text-red-500">*</span></label><textarea id="difficulty" rows="3" class="field mt-1" placeholder="Nêu hạn chế, khuyết điểm; nếu không có, ghi rõ “Không”."></textarea></div>
            <div><label class="text-[10px] font-extrabold text-slate-700">Đề xuất, kiến nghị</label><textarea id="proposal" rows="3" class="field mt-1" placeholder="Đề xuất hỗ trợ hoặc kiến nghị (nếu có)..."></textarea></div>
          </div>
          <aside class="bg-white border rounded-2xl shadow-sm p-4"><h3 class="text-xs font-extrabold text-brand-700">Tổng hợp tự động</h3><div class="mt-3 space-y-2" id="summaryCards"></div><div id="sectionBState" class="mt-3 rounded-xl bg-amber-50 border border-amber-200 p-3 text-[9px] text-amber-800 font-semibold">Mục B chưa được tính cho đến khi dữ liệu nhiệm vụ được xác nhận.</div><p class="text-[9px] text-slate-400 mt-3">Không sử dụng tỷ lệ do cá nhân tự chấm. Hệ thống chỉ lấy dữ liệu đã được cấp có thẩm quyền xác nhận.</p></aside>
        </div>
      </section>

      <section class="panel mt-3" data-panel="4">
        <div class="grid lg:grid-cols-3 gap-3">
          <div class="lg:col-span-2 bg-white border rounded-2xl shadow-sm p-4"><h2 class="text-sm font-extrabold text-brand-700">Kiểm tra hồ sơ báo cáo</h2><div id="checkList" class="mt-4 space-y-2"></div><div class="mt-4 rounded-xl border border-blue-100 bg-blue-50 p-3"><div class="flex flex-wrap items-center justify-between gap-2"><div><div class="text-[10px] font-extrabold text-blue-800">Tệp báo cáo đính kèm (không bắt buộc)</div><div id="attachmentInfo" class="text-[9px] text-blue-600 mt-1">Có thể tải bản nháp tương thích Word. Đính kèm tệp chưa mở.</div></div><div class="flex gap-2"><button type="button" id="wordBtn" class="px-3 py-2 rounded-xl bg-white border border-blue-200 text-blue-700 text-[9px] font-bold"><i class="bi bi-file-earmark-word mr-1"></i>Tải mẫu Word</button><label class="px-3 py-2 rounded-xl bg-blue-600 text-white text-[9px] font-bold cursor-pointer"><i class="bi bi-paperclip mr-1"></i>Đính kèm<input id="reportAttachment" disabled type="file" accept=".doc,.docx,.pdf" class="hidden"></label></div></div></div></div>
          <aside class="bg-white border rounded-2xl shadow-sm p-4"><h3 class="text-xs font-extrabold text-brand-700">Xác nhận của người báo cáo</h3><button id="previewBtn" type="button" class="mt-3 w-full px-3 py-2.5 rounded-xl border border-brand-600 text-brand-700 text-[10px] font-extrabold"><i class="bi bi-eye-fill mr-1"></i>XEM TRƯỚC BÁO CÁO</button><label class="mt-3 flex items-start gap-2 text-[10px] text-slate-600"><input id="confirmTruth" type="checkbox" class="mt-0.5 w-4 h-4 accent-blue-600"><span>Tôi xác nhận nội dung và minh chứng đã khai là đúng với kết quả thực hiện trong tháng.</span></label><button id="submitBtn" disabled class="primary-submit-btn mt-4 w-full py-3 rounded-xl text-xs disabled:cursor-not-allowed"><span class="cta-icon"><i class="bi bi-send-check-fill"></i></span><span>GỬI BÁO CÁO THÁNG</span><i class="bi bi-arrow-right-short text-lg"></i></button><p class="text-[9px] text-slate-400 mt-2 text-center">Gửi chính thức chưa mở. Kết quả khai báo chờ xác nhận; chưa tính Mục B.</p></aside>
        </div>
      </section>
    </div>
  <div class="report-actions"><button id="reportPrev">Quay lại</button><button id="reportNext">Tiếp tục</button><button id="reportSave" class="primary">Lưu nháp</button><button id="reportAssess">Sang tự đánh giá</button></div><p id="reportMessage" role="status" aria-live="polite"></p><dialog id="reportPreview"><button id="reportClose">Đóng</button><div id="reportPrint"></div></dialog></main></template><p>Mở biểu mẫu qua <a href="./index.html">HVA–NQ52</a> sau khi đăng nhập.</p></body></html>
